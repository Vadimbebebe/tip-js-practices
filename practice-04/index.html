<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПР4 — Задачи с формой</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header>
      <h1>Управление задачами</h1>
      <nav>
        <a href="./index.html">Общий набор</a>
        <a href="./index.html?dataset=variant">Свой вариант</a>
        <a href="./checks.html">Проверки</a>
      </nav>
    </header>

    <main>
      <section id="task-summary">
        <p>Всего: <span data-stat="total">0</span></p>
        <p>Выполнено: <span data-stat="completed">0</span></p>
        <p>Осталось: <span data-stat="pending">0</span></p>
        <p>Прогресс: <span data-stat="progress">0.0%</span></p>
        <p>Показано: <span data-stat="visible">0</span></p>
      </section>

      <section id="task-form-section">
        <h2 id="form-title">Добавление задачи</h2>
        <form id="task-form" novalidate>
          <label>
            ID
            <input name="id" type="number" min="1" step="1" required>
            <span class="field-error" data-error-for="id"></span>
          </label>

          <label>
            Название
            <input name="title" type="text" maxlength="100" required>
            <span class="field-error" data-error-for="title"></span>
          </label>

          <label>
            Приоритет
            <select name="priority">
              <option value="low">Низкий</option>
              <option value="medium" selected>Средний</option>
              <option value="high">Высокий</option>
            </select>
            <span class="field-error" data-error-for="priority"></span>
          </label>

          <div class="form-actions">
            <button type="submit" id="form-submit">Добавить задачу</button>
            <button type="button" id="form-cancel" hidden>Отмена</button>
          </div>
        </form>
      </section>

      <section id="task-filters" role="toolbar">
        <button type="button" data-filter="all" class="is-active" aria-pressed="true">
          <span>Все</span>
        </button>
        <button type="button" data-filter="pending" aria-pressed="false">
          <span>В работе</span>
        </button>
        <button type="button" data-filter="completed" aria-pressed="false">
          <span>Выполненные</span>
        </button>
      </section>

      <p id="operation-message" hidden></p>
      <p id="storage-message" hidden></p>
      <p id="empty-message" hidden></p>

      <ul id="task-list"></ul>

      <section id="reset-section">
        <button type="button" id="reset-storage">Сбросить сохранённые данные</button>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
